# Per-client request budgets. Keys are rate limited per key inside the application.
limit_req_zone $binary_remote_addr zone=codeharbor_mcp:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=codeharbor_auth:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=codeharbor_health:1m rate=30r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name codegraph.sigmob.com _;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_body_timeout 30s;

    # Interactive documentation is never served from the public listener.
    location ^~ /docs { return 404; }
    location = /openapi.json { return 404; }

    # MCP goes to the separate MCP service, never to the platform. Only deploy
    # this when the domain is reachable from trusted networks alone; the
    # service must list the domain in CODEHARBOR_MCP_ALLOWED_HOSTS.
    location = /mcp {
        limit_req zone=codeharbor_mcp burst=40 nodelay;
        proxy_pass http://mcp:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        # Longer than the MCP service's 60 s backend timeout so it can answer first.
        proxy_read_timeout 75s;
    }
    location ^~ /mcp/ { return 404; }
    location = /metrics { return 404; }
    location ^~ /health/ { return 404; }

    location ^~ /api/v1/auth/ {
        limit_req zone=codeharbor_auth burst=5 nodelay;
        proxy_pass http://codeharbor:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://codeharbor:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Requires CODEHARBOR_TRUST_PROXY=true in the application.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        # Aligned with the application request timeout.
        proxy_read_timeout 60s;
    }
}

# Preserve the legacy private HTTP endpoint while keeping the MCP container
# internal-only. This listener overwrites client identity before proxying so
# service-side per-client admission cannot be bypassed with request headers.
server {
    listen 8081;
    server_name _;
    client_max_body_size 64k;
    client_body_timeout 30s;

    location = /mcp {
        limit_req zone=codeharbor_mcp burst=40 nodelay;
        proxy_pass http://mcp:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 75s;
    }
    location = /health/live {
        proxy_pass http://mcp:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /health/ready {
        limit_req zone=codeharbor_health burst=5 nodelay;
        proxy_pass http://mcp:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { return 404; }
}
