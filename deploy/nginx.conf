# Per-client request budgets. Keys are rate limited per key inside the application.
limit_req_zone $binary_remote_addr zone=codeharbor_mcp:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=codeharbor_auth:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=codeharbor_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_body_timeout 30s;

    # Interactive documentation is never served from the public listener.
    location ^~ /docs { return 404; }
    location = /openapi.json { return 404; }

    # Health and monitoring endpoints are intended for internal access only.
    location = /metrics { return 404; }
    location ^~ /health/ { return 404; }

    location = /mcp {
        limit_req zone=codeharbor_mcp burst=40 nodelay;
        proxy_pass http://codeharbor:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
    location ^~ /api/v1/auth/ {
        # OAuth callback query parameters are confidential. The app logs route templates.
        access_log off;
        error_log /dev/null crit;
        limit_req zone=codeharbor_auth burst=5 nodelay;
        proxy_pass http://codeharbor:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
    location / {
        limit_req zone=codeharbor_api burst=40 nodelay;
        proxy_pass http://codeharbor:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Requires CODEHARBOR_TRUST_PROXY=true in the application.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        # Aligned with the application request timeout.
        proxy_read_timeout 60s;
    }
}
