services:
  codeharbor:
    build:
      context: ..
    restart: unless-stopped
    init: true
    # The production image backend has one serial index worker. Keep its Git and
    # CodeGraph children inside a host-preserving cgroup as well as bounded tmpfs.
    cpus: ${CODEHARBOR_APP_CPUS:-2.0}
    mem_limit: ${CODEHARBOR_APP_MEMORY_LIMIT:-4g}
    pids_limit: ${CODEHARBOR_APP_PIDS_LIMIT:-256}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      YUNXIAO_ENDPOINT: ${YUNXIAO_ENDPOINT:?set YUNXIAO_ENDPOINT}
      YUNXIAO_ORGANIZATION_ID: ${YUNXIAO_ORGANIZATION_ID:-}
      CODEHARBOR_GIT_HOSTS: ${CODEHARBOR_GIT_HOSTS:?set CODEHARBOR_GIT_HOSTS}
      CODEHARBOR_ALLOWED_HOSTS: ${CODEHARBOR_ALLOWED_HOSTS:?set CODEHARBOR_ALLOWED_HOSTS}
      CODEHARBOR_ALLOWED_ORIGINS: ${CODEHARBOR_ALLOWED_ORIGINS:-}
      CODEHARBOR_PUBLIC_ORIGIN: ${CODEHARBOR_PUBLIC_ORIGIN:?set CODEHARBOR_PUBLIC_ORIGIN}
      CODEHARBOR_FEISHU_APP_ID: ${CODEHARBOR_FEISHU_APP_ID:?set CODEHARBOR_FEISHU_APP_ID}
      CODEHARBOR_FEISHU_APP_SECRET_FILE: /run/secrets/feishu_app_secret
      CODEHARBOR_FEISHU_TENANT_KEY: ${CODEHARBOR_FEISHU_TENANT_KEY:?set CODEHARBOR_FEISHU_TENANT_KEY}
      CODEHARBOR_FEISHU_SUPER_ADMIN_OPEN_ID: ${CODEHARBOR_FEISHU_SUPER_ADMIN_OPEN_ID:?set CODEHARBOR_FEISHU_SUPER_ADMIN_OPEN_ID}
      CODEHARBOR_TRUST_PROXY: 'true'
      CODEHARBOR_DOCS_ENABLED: ${CODEHARBOR_DOCS_ENABLED:-false}
      CODEHARBOR_UI_ENABLED: ${CODEHARBOR_UI_ENABLED:-true}
      CODEHARBOR_UI_MCP_URL: ${CODEHARBOR_UI_MCP_URL:-}
      CODEHARBOR_ACCESS_TTL_MS: ${CODEHARBOR_ACCESS_TTL_MS:-21600000}
      CODEHARBOR_AUDIT_RETENTION_DAYS: ${CODEHARBOR_AUDIT_RETENTION_DAYS:-180}
      CODEHARBOR_DATABASE_URL_FILE: /run/secrets/database_url
      CODEHARBOR_KEY_PROVIDER: vault-transit
      CODEHARBOR_VAULT_ADDR: ${CODEHARBOR_VAULT_ADDR:?set CODEHARBOR_VAULT_ADDR}
      CODEHARBOR_VAULT_TRANSIT_KEY: ${CODEHARBOR_VAULT_TRANSIT_KEY:?set CODEHARBOR_VAULT_TRANSIT_KEY}
      CODEHARBOR_VAULT_TRANSIT_MOUNT: ${CODEHARBOR_VAULT_TRANSIT_MOUNT:-transit}
      CODEHARBOR_VAULT_TOKEN_FILE: /run/secrets/vault_token
      CODEHARBOR_VAULT_WRAPPED_KEY_FILE: /run/secrets/wrapped_key
      CODEHARBOR_METRICS_TOKEN_FILE: /run/secrets/metrics_token
    volumes:
      - codeharbor_data:/data
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    secrets: [database_url, vault_token, wrapped_key, metrics_token, feishu_app_secret]
    networks: [backend]
  nginx:
    image: ${CODEHARBOR_NGINX_IMAGE:?set an approved immutable nginx image reference}
    restart: unless-stopped
    ports:
      - '${CODEHARBOR_LISTEN_ADDR:-127.0.0.1}:8443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CODEHARBOR_TLS_CERT:?set CODEHARBOR_TLS_CERT}:/run/tls/server.crt:ro
      - ${CODEHARBOR_TLS_KEY:?set CODEHARBOR_TLS_KEY}:/run/tls/server.key:ro
    networks: [backend]
    depends_on: [codeharbor]
networks:
  backend:
volumes:
  codeharbor_data:
secrets:
  database_url:
    file: ${CODEHARBOR_DATABASE_URL_FILE:?set CODEHARBOR_DATABASE_URL_FILE}
  vault_token:
    file: ${CODEHARBOR_VAULT_TOKEN_FILE:?set CODEHARBOR_VAULT_TOKEN_FILE}
  wrapped_key:
    file: ${CODEHARBOR_VAULT_WRAPPED_KEY_FILE:?set CODEHARBOR_VAULT_WRAPPED_KEY_FILE}
  metrics_token:
    file: ${CODEHARBOR_METRICS_TOKEN_FILE:?set CODEHARBOR_METRICS_TOKEN_FILE}
  feishu_app_secret:
    file: ${CODEHARBOR_FEISHU_APP_SECRET_FILE:?set CODEHARBOR_FEISHU_APP_SECRET_FILE}
