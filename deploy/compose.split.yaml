# Apply after compose.yaml and compose.image.yaml. The MCP listener is bound
# to a specific host private IP, never to every host interface.
services:
  codeharbor:
    environment:
      CODEHARBOR_PUBLIC_MCP_DISABLED: 'true'
      CODEHARBOR_INTERNAL_MCP_SOCKET: /run/codeharbor-mcp-internal/mcp.sock
      CODEHARBOR_INTERNAL_MCP_TOKEN_FILE: /run/secrets/internal_mcp_token
    volumes:
      - type: bind
        source: ${CODEHARBOR_INTERNAL_MCP_SOCKET_DIR:?set a dedicated private socket directory}
        target: /run/codeharbor-mcp-internal
    secrets:
      - internal_mcp_token

  nginx:
    volumes:
      - ./nginx.split.conf:/etc/nginx/conf.d/default.conf:ro

  mcp:
    build:
      context: ..
    command: [node, dist/mcp-main.js]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      CODEHARBOR_BIND: 0.0.0.0
      PORT: '8081'
      CODEHARBOR_INTERNAL_MCP_SOCKET: /run/codeharbor-mcp-internal/mcp.sock
      CODEHARBOR_INTERNAL_MCP_TOKEN_FILE: /run/secrets/internal_mcp_token
      CODEHARBOR_ALLOWED_HOSTS: ${CODEHARBOR_MCP_ALLOWED_HOSTS:?set private IP and port}
      CODEHARBOR_ALLOWED_ORIGINS: ${CODEHARBOR_MCP_ALLOWED_ORIGINS:-}
    ports:
      - '${CODEHARBOR_MCP_LISTEN_ADDR:?set a specific private host IP}:${CODEHARBOR_MCP_LISTEN_PORT:-18080}:8081'
    volumes:
      - type: bind
        source: ${CODEHARBOR_INTERNAL_MCP_SOCKET_DIR:?set a dedicated private socket directory}
        target: /run/codeharbor-mcp-internal
        read_only: true
    secrets:
      - internal_mcp_token
    networks: [backend]
    depends_on:
      codeharbor:
        condition: service_started

secrets:
  internal_mcp_token:
    file: ${CODEHARBOR_INTERNAL_MCP_TOKEN_HOST_FILE:?set a distinct private internal MCP token file}
